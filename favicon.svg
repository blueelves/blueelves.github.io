<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="#07070d"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="13.75"
        fill="none" stroke="url(#neon)" stroke-opacity="0.45" stroke-width="1.5"/>

  <g filter="url(#glow)" fill="none" stroke="url(#neon)"
     stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 45 L32 19 L44 45"/>
  </g>
  <circle cx="32" cy="45" r="3.4" fill="#00f0ff"/>
</svg>
